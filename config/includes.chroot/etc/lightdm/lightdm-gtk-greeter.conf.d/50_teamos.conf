# TeamOS specific defaults for lightdm-gtk-greeter
#
# Reference: https://github.com/BunsenLabs/bunsen-configs/blob/carbon/lightdm-gtk-greeter.conf.d/50_bunsen.conf

[greeter]
# GTK theme (Adwaita is always available, swap for a custom theme later)
theme-name = Adwaita
# Icon theme
icon-theme-name = Adwaita
# Background image (place a file at this path via includes.chroot, or set a colour e.g. #1a1a2e)
#background = /usr/share/images/teamos/login/default
background = #1a1a2e
# Font
font-name = Sans 10
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
# Login window position: x%, y%
position = 50%,center 40%,start
# Indicators in the panel bar
indicators = ~clock;~language;~session;~a11y;~power
# Clock format
clock-format = %H:%M    %a, %b %d
# Hide user avatars to keep it clean
#hide-user-image = true
