#################################
# TeamOS picom (forest-vivid)
#################################

backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 24;
shadow-opacity = 0.68;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Rofi'",
  "class_g ?= 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.028;
fade-out-step = 0.028;
fade-delta = 4;

inactive-opacity = 0.84;
active-opacity = 1.0;
frame-opacity = 0.88;

corner-radius = 14;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

blur-method = "dual_kawase";
blur-strength = 6;

wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
