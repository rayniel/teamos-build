#################################
# TeamOS picom (slate)
#################################

backend = "glx";
vsync = true;
use-damage = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Rofi'",
  "class_g ?= 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 5;

inactive-opacity = 0.9;
active-opacity = 1.0;
frame-opacity = 0.94;

corner-radius = 6;
round-borders = 1;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

blur-method = "none";

wintypes:
{
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};